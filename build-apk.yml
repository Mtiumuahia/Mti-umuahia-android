name: Build MTI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms" || true
          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Extract MTI Android project
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Repository files:"
          find . -maxdepth 2 -type f -print

          test -f MTI-Android-V302-source.zip

          unzip -q MTI-Android-V302-source.zip -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 3 -type f \
            \( -name 'settings.gradle.kts' -o -name 'build.gradle.kts' -o -name 'AndroidManifest.xml' \) \
            -print

          test -f extracted/project/settings.gradle.kts
          test -f extracted/project/app/build.gradle.kts

      - name: Build MTI debug APK
        working-directory: extracted/project
        run: |
          set -e

          echo "Gradle version:"
          gradle --version

          echo "Starting MTI Android build..."

          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        run: |
          set -e

          echo "Searching for APK..."

          APK="$(find extracted/project/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            find extracted/project/app/build -type f -print || true
            exit 1
          fi

          echo "APK successfully produced:"
          ls -lh "$APK"

          mkdir -p apk-output
          cp "$APK" apk-output/MTI-Umuahia-V302-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MTI-Umuahia-V302-debug-APK
          path: apk-output/MTI-Umuahia-V302-debug.apk
          if-no-files-found: error
          retention-days: 14
