name: Build MTI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract MTI Android project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q MTI-Android-V302-source.zip -d extracted
          test -f extracted/project/settings.gradle.kts
          test -f extracted/project/app/build.gradle.kts

      - name: Build MTI debug APK
        working-directory: extracted/project
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MTI-Umuahia-debug-APK-V302
          path: extracted/project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
