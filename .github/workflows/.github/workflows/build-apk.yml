name: Build MTI Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -L --fail --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle-8.9-bin.zip

          mkdir -p "$HOME/gradle"
          unzip -q /tmp/gradle-8.9-bin.zip -d "$HOME/gradle"

          echo "GRADLE_HOME=$HOME/gradle/gradle-8.9" >> "$GITHUB_ENV"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Locate and extract MTI V302 source package
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/mti-package"

          PACKAGE_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$PACKAGE_ZIP" ]; then
            echo "ERROR: V302 ZIP package was not found."
            exit 1
          fi

          echo "Found package: $PACKAGE_ZIP"

          unzip -q "$PACKAGE_ZIP" -d "$GITHUB_WORKSPACE/mti-package"

          SOURCE_ZIP="$(find "$GITHUB_WORKSPACE/mti-package" -type f -name '*source*.zip' | head -n 1)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: MTI V302 source ZIP was not found inside the uploaded package."
            find "$GITHUB_WORKSPACE/mti-package" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Found source package: $SOURCE_ZIP"

          mkdir -p "$GITHUB_WORKSPACE/mti-source"

          unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/mti-source"

          echo "Extracted MTI source:"
          find "$GITHUB_WORKSPACE/mti-source" -maxdepth 3 -type f \
            \( -name 'settings.gradle.kts' -o -name 'build.gradle.kts' -o -name 'gradlew' \) \
            -print

      - name: Locate Android project
        run: |
          set -e

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/mti-source" \
            -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "MTI Android project:"
          echo "$PROJECT_DIR"

          echo "MTI_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        run: |
          set -e

          cd "$MTI_PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app

          echo "Project verification passed."
          echo "Gradle version:"
          gradle --version

      - name: Build debug APK
        run: |
          set -e

          cd "$MTI_PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        run: |
          set -e

          APK="$(find "$MTI_PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK produced:"
          ls -lh "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/MTI-Umuahia-V302-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTI-Umuahia-V302-debug-apk
          path: apk-output/MTI-Umuahia-V302-debug.apk
          if-no-files-found: error
