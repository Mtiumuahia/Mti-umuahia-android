name: Build MTI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract MTI Android project
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          test -f MTI-Android-V302-source.zip

          unzip -q MTI-Android-V302-source.zip -d extracted

          test -f extracted/project/settings.gradle.kts
          test -f extracted/project/app/build.gradle.kts

          echo "MTI Android project found successfully."

      - name: Build MTI debug APK
        working-directory: extracted/project
        run: |
          set -e

          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        run: |
          set -e

          APK="$(find extracted/project/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/MTI-Umuahia-V302-debug.apk

          echo "APK successfully produced:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MTI-Umuahia-V302-debug-APK
          path: apk-output/MTI-Umuahia-V302-debug.apk
          if-no-files-found: error
          retention-days: 14
