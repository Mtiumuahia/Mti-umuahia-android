name: Build MTI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract MTI Android project
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Repository contents:"
          find . -maxdepth 3 -type f -print

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*V302*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No MTI source ZIP was found."
            exit 1
          fi

          echo "Using source package:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "Searching for Android project..."

          SETTINGS_FILE="$(find extracted \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            echo "Files extracted:"
            find extracted -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "MTI Android project verified successfully."

          echo "MTI_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build MTI debug APK
        working-directory: ${{ env.MTI_PROJECT_DIR }}
        run: |
          set -e

          echo "Building MTI Android APK..."

          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        run: |
          set -e

          APK="$(find "$MTI_PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."

            echo "Build output:"
            find "$MTI_PROJECT_DIR/app/build" \
              -maxdepth 6 \
              -type f \
              -print || true

            exit 1
          fi

          echo "APK successfully produced:"
          ls -lh "$APK"

          mkdir -p apk-output
          cp "$APK" apk-output/MTI-Umuahia-V302-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MTI-Umuahia-V302-debug-APK
          path: apk-output/MTI-Umuahia-V302-debug.apk
          if-no-files-found: error
          retention-days: 14
